<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rathore Heritage Developers | Raj Dwar — Timeless Royal Heritage</title>

  <meta
    name="description"
    content="Rathore Heritage Developers — Raj Dwar to a world of timeless heritage, royal craftsmanship, authentic Rajasthan architecture, bespoke interiors and enduring spaces."
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --brown: #2a160d;
      --brown-deep: #170b07;
      --brown-soft: #432619;

      --beige: #e8dcc6;
      --beige-light: #f2eadb;
      --cream: #f7f0e3;

      --gold: #c5a15b;
      --gold-light: #ce9721;
      --gold-dark: #987638;

      --ink: #966e1e;
      --muted: #756452;

      --white: #fffaf0;

      --serif: "Cormorant Garamond", serif;
      --sans: "DM Sans", sans-serif;

      --container: 1280px;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: var(--sans);
      background: var(--brown-deep);
      color: var(--cream);
      width: 100%;
      overflow-x: hidden;
      position: relative;
    }

    body.menu-open {
      overflow: hidden;
    }

    img, video {
      width: 100%;
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: var(--gold);
      color: var(--brown-deep);
    }


    /* =========================================================
       UTILITIES & GLOBAL ALL-CAPS FOR HEADINGS / TAGLINES
    ========================================================= */

    .container {
      width: min(calc(100% - 40px), var(--container));
      margin-inline: auto;
    }

    @media (min-width: 768px) {
      .container {
        width: min(calc(100% - 80px), var(--container));
      }
    }

    .section {
      position: relative;
      padding: 90px 0;
      overflow: hidden;
      width: 100%;
    }

    @media (min-width: 768px) {
      .section {
        padding: 140px 0;
      }
    }

    .brown {
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(197,161,91,.08),
          transparent 35%
        ),
        var(--brown);
      color: var(--cream);
    }

    .beige {
      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(197,161,91,.12),
          transparent 30%
        ),
        var(--beige);
      color: var(--ink);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: "";
      width: 45px;
      height: 1px;
      background: currentColor;
    }

    .beige .eyebrow {
      color: var(--gold-dark);
    }

    /* ALL HEADINGS AND TAGLINES IN CAPITAL LETTERS PER INSTRUCTIONS */
    h1, h2, h3, h4, .section-title, .eyebrow, .hero-kicker, .hero-description, .section-intro, .craft-row, .offer-card h3, .offer-card p, .expertise-content h3, .expertise-tags, .project-meta, .detail-meta, .detail-tag {
      text-transform: uppercase;
    }

    /* Hero ko chhodkar baki sabhi sections ki main headings ka color gold */
    .section:not(.hero) .section-title {
      color: var(--gold);
    }
    .beige.section .section-title {
      color: var(--gold-dark);
    }

    .section-title {
      font-family: var(--serif);
      font-size: clamp(38px, 6vw, 100px);
      font-weight: 500;
      line-height: .92;
      letter-spacing: -.035em;
      margin-bottom: 30px;
    }

    .section-title span {
      color: var(--cream);
    }

    .beige .section-title span {
      color: var(--ink);
    }

    .section-intro {
      max-width: 720px;
      font-size: 15px;
      line-height: 1.8;
      opacity: .78;
    }

    .gold-line {
      width: 90px;
      height: 1px;
      background: var(--gold);
      margin: 30px 0;
    }

    /* BEIGE SURROUNDING WRAPPER FOR CARDS & IMAGES */
    .beige-card-wrap {
      background: var(--beige);
      border: 1px solid rgba(197,161,91,.4);
      padding: 14px;
      color: var(--ink);
      transition: .5s var(--ease);
    }

    .brown .beige-card-wrap {
      background: var(--beige);
      color: var(--ink);
    }


    /* =========================================================
       PRELOADER
    ========================================================= */

    .preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--brown-deep);
      display: grid;
      place-items: center;
      transition: opacity 1s var(--ease), visibility 1s;
    }

    .preloader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-inner {
      text-align: center;
    }

    .loader-mark {
      width: 90px;
      height: 90px;
      margin: auto;
      border: 1px solid rgba(197,161,91,.4);
      border-radius: 50%;
      display: grid;
      place-items: center;
      animation: spin 3s linear infinite;
    }

    .loader-mark::before {
      content: "R";
      font-family: var(--serif);
      font-size: 42px;
      color: var(--gold);
      animation: spinReverse 3s linear infinite;
    }

    .loader-text {
      margin-top: 25px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .35em;
      font-size: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      to { transform: rotate(-360deg); }
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 20px 0;
      transition: .5s var(--ease);
    }

    @media (min-width: 768px) {
      header {
        padding: 28px 0;
      }
    }

    header.scrolled {
      padding: 12px 0;
      background: rgba(23,11,7,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(197,161,91,.16);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-symbol {
      width: 82px;
      height: 82px;
      overflow: visible;
      display: grid;
      place-items: center;
    }

    @media (min-width: 768px) {
      .brand-symbol {
        width: 130px;
        height: 130px;
      }
    }

    .brand-symbol img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-text strong {
      display: block;
      font-family: var(--serif);
      font-size: 19px;
      letter-spacing: .08em;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .brand-text strong {
        font-size: 23px;
      }
    }

    .brand-text small {
      display: block;
      margin-top: -2px;
      font-size: 7px;
      letter-spacing: .25em;
      color: var(--gold);
    }

    @media (min-width: 768px) {
      .brand-text small {
        font-size: 8px;
        letter-spacing: .3em;
      }
    }

    .menu-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: none;
      color: var(--cream);
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: 10px;
    }

    .hamburger {
      width: 24px;
      height: 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      transition: transform .3s var(--ease);
    }

    .hamburger span {
      background: currentColor;
      border-radius: 1px;
      transition: .3s var(--ease);
    }

    .menu-trigger.active .hamburger {
      transform: rotate(90deg);
    }

    .menu-trigger.active .hamburger span {
      background: var(--gold);
    }


    /* =========================================================
       SIMPLIFIED DROPDOWN / COMPACT MENU PANEL
    ========================================================= */

    .menu-overlay {
      position: fixed;
      top: 75px;
      right: 20px;
      width: min(320px, calc(100vw - 40px));
      z-index: 900;
      background: linear-gradient(135deg, rgba(23,11,7,.98), rgba(42,22,13,.98));
      border: 1px solid rgba(197,161,91,.35);
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
      padding: 25px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all .3s var(--ease);
      border-radius: 4px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu-links a {
      display: block;
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: .05em;
      color: var(--cream);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(197,161,91,.15);
      transition: .3s var(--ease);
    }

    .menu-links a:hover {
      color: var(--gold);
      padding-left: 8px;
    }


    /* =========================================================
       HERO VIDEO BACKGROUND
    ========================================================= */

    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: var(--brown-deep);
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .65;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(23,11,7,.25), rgba(23,11,7,.45) 45%, rgba(23,11,7,.98));
    }

    .hero-content {
      position: relative;
      z-index: 2;
      width: min(calc(100% - 40px), var(--container));
      margin: 0 auto;
      padding: 140px 0 80px;
    }

    @media (min-width: 768px) {
      .hero-content {
        width: min(calc(100% - 80px), var(--container));
        padding: 180px 0 100px;
      }
    }

    .hero-kicker {
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: .3em;
      font-size: 10px;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(26px, 3.8vw, 56px);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: 0.02em;
      max-width: 1100px;
      color: var(--cream);
      text-transform: uppercase;
    }

    .hero h1 em,
    .hero h1 .gold-italic {
      color: var(--gold-light);
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0.01em;
    }


    .hero-bottom {
      display: flex;
      flex-direction: column;
      gap: 30px;
      margin-top: 40px;
    }

    @media (min-width: 900px) {
      .hero-bottom {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        gap: 50px;
        margin-top: 50px;
      }
    }

    .hero-description {
      max-width: 560px;
      font-size: 14px;
      line-height: 1.8;
      color: rgba(255,250,240,.75);
    }

    .hero-scroll {
      display: none;
    }

    @media (min-width: 768px) {
      .hero-scroll {
        display: flex;
        writing-mode: vertical-rl;
        text-transform: uppercase;
        letter-spacing: .25em;
        font-size: 9px;
        color: var(--gold-light);
        align-items: center;
        gap: 12px;
      }
      .hero-scroll::after {
        content: "";
        width: 1px;
        height: 70px;
        background: var(--gold);
      }
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .luxury-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 20px;
      margin-top: 25px;
      padding: 15px 22px;
      border: 1px solid rgba(197,161,91,.7);
      color: var(--cream);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 10px;
      overflow: hidden;
      transition: .4s var(--ease);
      background: transparent;
      width: fit-content;
    }

    .beige .luxury-btn {
      color: var(--ink);
    }

    .luxury-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: .45s var(--ease);
      z-index: -1;
    }

    .luxury-btn:hover {
      color: var(--brown-deep);
    }

    .luxury-btn:hover::before {
      transform: translateX(0);
    }

    .luxury-btn i {
      transition: .4s var(--ease);
    }

    .luxury-btn:hover i {
      transform: translateX(6px);
    }


    /* =========================================================
       LEGACY (ABOUT)
    ========================================================= */

    .legacy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 50px;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .legacy-grid {
        grid-template-columns: .85fr 1.15fr;
        gap: 80px;
      }
    }

    .legacy-image-wrap {
      position: relative;
    }

    .legacy-image {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .image-frame {
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(197,161,91,.55);
      pointer-events: none;
    }

    .legacy-copy {
      padding-right: 0;
    }

    @media (min-width: 1024px) {
      .legacy-copy {
        padding-right: 30px;
      }
    }

    .legacy-copy p {
      line-height: 1.9;
      opacity: .78;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .signature {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--gold);
      margin-top: 30px;
    }


    /* =========================================================
       LEADERSHIP / FOUNDERS SECTION (Square Cards)
    ========================================================= */

    .leadership-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-top: 50px;
    }

    @media (min-width: 768px) {
      .leadership-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 40px;
      }
    }

    .leader-card {
      background: var(--beige);
      border: 1px solid rgba(197,161,91,.5);
      padding: 30px;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 380px;
      transition: transform .4s var(--ease), box-shadow .4s var(--ease);
    }

    @media (min-width: 768px) {
      .leader-card {
        padding: 40px;
      }
    }

    .leader-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(0,0,0,.3);
    }

    .leader-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .leader-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--gold-dark);
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .leader-avatar {
        width: 85px;
        height: 85px;
      }
    }

    .leader-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .leader-titles h3 {
      font-family: var(--serif);
      font-size: 22px;
      color: var(--gold-dark); /* Card Tagline / Title color changed to Gold */
      line-height: 1.1;
      margin-bottom: 5px;
    }

    @media (min-width: 768px) {
      .leader-titles h3 {
        font-size: 26px;
      }
    }

    .leader-titles span {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--gold-dark);
      font-weight: 600;
      display: block;
    }

    .leader-body p {
      font-size: 13px;
      line-height: 1.8;
      opacity: .85;
      color: var(--ink);
    }

    .leader-footer {
      border-top: 1px solid rgba(36,22,14,.15);
      padding-top: 15px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--gold-dark);
    }


    /* =========================================================
       HERITAGE CONSULTANCY SECTION (NEW)
    ========================================================= */

    .consultancy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 50px;
      align-items: center;
    }

    @media (min-width: 1024px) {
      .consultancy-grid {
        grid-template-columns: 1fr 1fr;
        gap: 80px;
      }
    }

    .consultancy-slider-wrap {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .consultancy-slider-wrap {
        height: 520px;
      }
    }

    .consultancy-slider-wrap img,
    .consultancy-slider-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s var(--ease);
    }

    .consultancy-slider-wrap img.active,
    .consultancy-slider-wrap video.active,
    .consultancy-video-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .consultancy-video-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s var(--ease);
    }

    .consultancy-video-slide .consultancy-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      pointer-events: none;
    }

    .consultancy-play-stop {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 12;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(23,11,7,.86);
      border: 1px solid var(--gold);
      color: var(--gold);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .3s, color .3s, transform .3s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .consultancy-play-stop:hover {
      background: var(--gold);
      color: var(--brown-deep);
      transform: scale(1.06);
    }

    .consultancy-play-stop i {
      font-size: 14px;
      margin-left: 2px;
    }

    .consultancy-play-stop.is-playing i {
      margin-left: 0;
    }

    .consultancy-slider-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .consultancy-ctrl-btn {
      width: 44px;
      height: 44px;
      background: rgba(23,11,7,0.8);
      border: 1px solid var(--gold);
      color: var(--gold);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .3s;
    }

    .consultancy-ctrl-btn:hover {
      background: var(--gold);
      color: var(--brown-deep);
    }

    /* Heritage Consultancy 6-Step Process Track */
    .consultancy-process-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 55px;
      width: 100%;
    }

    .consultancy-step-box {
      flex: 1;
      min-width: 0;
      height: 108px;
      padding: 20px 14px 18px 18px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(197, 161, 91, 0.28);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      box-sizing: border-box;
      transition: border-color 0.3s ease, background-color 0.3s ease, transform 0.3s ease;
    }

    .consultancy-step-box:hover {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }

    .consultancy-step-num {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      color: var(--gold);
      display: block;
      text-align: left;
    }

    .consultancy-step-title {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.35;
      display: block;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .consultancy-step-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 16px;
      color: var(--gold);
      opacity: 0.85;
    }

    .consultancy-step-arrow svg {
      width: 16px;
      height: 10px;
      display: block;
    }

    @media (max-width: 1023px) {
      .consultancy-process-track {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 45px;
      }

      .consultancy-step-arrow {
        display: none;
      }

    /* Even cards (2, 4, 6, 8, 10): match the supplied rectangular
       heritage frame with the scalloped Mughal arch inside it. */
    /* Even cards: square outer card, brown field behind the scalloped arch,
       with the photograph visible only inside the arch opening. */
    .craft-card-item.shape-dome .craft-card-img-wrap {
      /* Even cards: photo only inside the scalloped arch; the surrounding field
         uses the site's exact dark-brown token, with no visible frame/outline. */
      width: 100%;
      height: auto;
      aspect-ratio: 5 / 7;
      min-height: 0;
      border-radius: 0;
      clip-path: none;
      isolation: isolate;
      background: var(--brown);
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
    }

    .craft-card-item.shape-dome .craft-card-img-wrap > img {
      display: block;
      max-width: 100%;

    .craft-card-item.shape-dome .craft-card-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;

    .craft-heritage-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
      fill: none;
      stroke: none;
    }

    .craft-heritage-frame .craft-arch-brown {
      /* Solid site brown only; no sketch/frame outline */
      fill: var(--brown);
      stroke: none;
      stroke-width: 0;
    }

    /* The reference sketch has no visible outline: keep only the brown
       background above the arch and the photograph clipped to the arch. */
    .craft-heritage-frame .craft-outer-frame,
    .craft-heritage-frame .craft-arch-outline {
      display: none;
      stroke: none;
      fill: none;
    }

      height: 100%;

    @media (hover: hover) and (pointer: fine) {
